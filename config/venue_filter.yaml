# 会場特化型フィルター設定
# B-1: ROIの高い会場で購入量を増やし、低い会場で減らす
#
# 作成日: 2025-12-16
# 基準データ: 2025年1-11月バックテスト結果（936レース, ROI 117.0%）
#
# 更新: analyze_venue_roi.py の実行結果に基づいて更新

venue_filter:
  # フィルター有効化フラグ
  enabled: true

  # ========================================
  # Tier1: 高ROI会場（購入量増加）
  # ========================================
  # ROI 200%以上の会場
  # 過去実績で高い収益性を示した会場
  tier1_venues:
    - 22  # 福岡 (ROI 421.8%)
    - 11  # 琵琶湖 (ROI 372.8%)
    - 19  # 下関 (ROI 321.6%)
    - 21  # 芦屋 (ROI 220.7%)
    - 7   # 蒲郡 (ROI 220.2%)

  # Tier1購入倍率
  tier1_multiplier: 1.5

  # ========================================
  # Tier2: 標準会場（通常購入）
  # ========================================
  # ROI 80-200%の会場
  # tier2_venuesは指定不要（Tier1/Tier3以外が自動的にTier2）
  tier2_venues: []

  # Tier2購入倍率
  tier2_multiplier: 1.0

  # ========================================
  # Tier3: 低ROI会場（購入量減少）
  # ========================================
  # ROI 80%未満の会場
  # 過去実績で低い収益性を示した会場
  tier3_venues:
    - 5   # 多摩川 (ROI 0.0%)
    - 3   # 江戸川 (ROI 0.0%)
    - 12  # 住之江 (ROI 0.0%)
    - 2   # 戸田 (ROI 0.0%)
    - 14  # 鳴門 (ROI 0.0%)
    - 4   # 平和島 (ROI 24.6%)
    - 9   # 津 (ROI 33.6%)
    - 8   # 常滑 (ROI 42.3%)
    - 20  # 若松 (ROI 52.6%)
    - 23  # 唐津 (ROI 68.0%)
    - 16  # 児島 (ROI 68.6%)
    - 17  # 宮島 (ROI 74.9%)

  # Tier3購入倍率
  tier3_multiplier: 0.5

  # ========================================
  # 詳細設定
  # ========================================
  # 最小購入金額（倍率適用後もこの金額以上）
  min_bet_amount: 100

  # 最大購入金額（倍率適用後もこの金額以下）
  max_bet_amount: 2000

  # 倍率適用の条件
  apply_conditions:
    # 信頼度条件（これらの信頼度のみ倍率適用）
    confidences: ['C', 'D']

    # 1コース級別条件（これらの級別のみ倍率適用）
    c1_ranks: ['A1']

  # ========================================
  # 統計情報（参考）
  # ========================================
  # 以下は analyze_venue_roi.py 実行時に更新される統計情報
  statistics:
    analysis_period: '2025-01-01 to 2025-11-30'
    total_purchase_count: 0
    total_hit_count: 0
    overall_roi: 0.0
    last_updated: '2025-12-16'

  # ========================================
  # 会場別詳細統計（参考）
  # ========================================
  # analyze_venue_roi.py で生成される詳細データ
  venue_details:
    # venue_code:
    #   name: 会場名
    #   purchase_count: 購入数
    #   hit_count: 的中数
    #   roi: ROI%
    #   profit: 収支
