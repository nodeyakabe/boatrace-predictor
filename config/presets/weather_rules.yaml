# 天候ルールプリセット
# 風速・波高・風向による補正ルールを定義
#
# 作成日: 2025-12-15
# データソース: weather_rules.json、weather_venue_wind_adjuster_v2.py

meta:
  version: "1.0"
  updated_at: "2025-12-15"
  updated_by: "manual"
  data_source: "weatherテーブル + resultsテーブル (5640件)、2025年暴風データ(264レース)"

# 風速カテゴリ定義
wind_speed_categories:
  calm:
    min: 0
    max: 2
    label: "微風"
  moderate:
    min: 3
    max: 5
    label: "中風"
  strong:
    min: 6
    max: 7
    label: "強風"
  storm:
    min: 8
    max: 99
    label: "暴風"

# 波高カテゴリ定義
wave_height_categories:
  calm:
    min: 0
    max: 2
    label: "静穏"
  moderate:
    min: 3
    max: 5
    label: "中波"
  rough:
    min: 6
    max: 99
    label: "高波"

# 風向カテゴリ定義
wind_direction_categories:
  headwind:
    directions: ["北", "北北西", "北西", "北北東", "北東"]
    description: "向かい風 - 1コース有利傾向"
  tailwind:
    directions: ["南", "南南西", "南西", "南南東", "南東"]
    description: "追い風 - まくり有利傾向"
  crosswind:
    directions: ["東", "西", "東北東", "西北西", "東南東", "西南西"]
    description: "横風 - 影響は会場による"

# 全会場共通のグローバルルール
global_rules:
  # 全会場合計での風速別1コース勝率データ
  # 弱風: 59.8%, 中風: 58.6%, 強風: 48.3%
  wind_impact:
    calm_course1_rate: 0.598
    moderate_course1_rate: 0.586
    strong_course1_rate: 0.483
    strong_wind_penalty: -0.115

  # 強風時（6m以上）の補正
  strong_wind:
    course_1_penalty: -5.0
    course_2_bonus: 2.5
    course_3_bonus: 2.5
    course_4_bonus: 1.5
    course_5_bonus: 1.0
    course_6_bonus: 0.5

  # 高波時（6cm以上）の補正
  high_wave:
    course_1_penalty: -3.0
    course_2_bonus: 1.0
    course_3_bonus: 1.0
    course_4_bonus: 1.5
    course_5_bonus: 1.0
    course_6_bonus: 0.5

  # 風向による補正（向かい風・追い風）
  headwind:
    course_1_bonus: 2.0
    course_2_penalty: -1.0
  tailwind:
    course_1_penalty: -2.0
    makuri_bonus: 3.0

# 会場別オーバーライド（グローバルを上書き）
venue_overrides:
  "02":
    name: "戸田"
    description: "強風時に荒れやすい"
    strong_wind:
      course_1_penalty: -10.0
      course_2_bonus: 5.0
      course_3_bonus: 5.0

  "08":
    name: "常滑"
    description: "強風の影響が最大"
    strong_wind:
      course_1_penalty: -15.0
      course_2_bonus: 7.5
      course_3_bonus: 7.5
      course_4_bonus: 5.0
      course_5_bonus: 3.0
      course_6_bonus: 2.0

  "10":
    name: "三国"
    description: "風・波の影響大"
    strong_wind:
      course_1_penalty: -7.5
      course_2_bonus: 4.0
      course_3_bonus: 4.0
    high_wave:
      course_1_penalty: -5.0
      course_4_bonus: 3.0

  "15":
    name: "丸亀"
    description: "強風でやや荒れやすい"
    strong_wind:
      course_1_penalty: -5.0

  "06":
    name: "浜名湖"
    description: "風の影響中程度"
    strong_wind:
      course_1_penalty: -4.0

  "20":
    name: "若松"
    description: "強風でやや荒れやすい"
    strong_wind:
      course_1_penalty: -4.0

  "23":
    name: "唐津"
    description: "強風でも1コースは有利"
    strong_wind:
      course_1_penalty: -4.0

  "24":
    name: "大村"
    description: "強風でも1コースは有利"
    strong_wind:
      course_1_penalty: -4.0

# 暴風時（8m以上）の会場×風向別特殊補正
