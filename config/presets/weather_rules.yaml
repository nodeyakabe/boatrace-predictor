# 複合条件ルール
compound_rules:
  strong_wind_high_wave:
    description: "強風かつ高波 - 大荒れ"
    conditions:
      wind_category: "strong"
      wave_category: "rough"
    adjustments:
      course_1_penalty: -8.0
      outer_course_bonus: 4.0

  storm_any:
    description: "暴風（8m+） - 予測困難"
    conditions:
      wind_category: "storm"
    adjustments:
      confidence_penalty: -0.2
      course_1_penalty: -10.0
