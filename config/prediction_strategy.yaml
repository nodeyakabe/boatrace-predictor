# 予測戦略設定
#
# 2025年分析結果に基づく予測コース制御設定
# - 1コース予測時: 精度60.5%（ベースライン55.1%を上回る）
# - 非1コース予測時: 精度24.8%（極めて低い）
#
# 背景:
# - モデルは1コース予測に関しては優秀（+5.4pt）
# - しかし2-6コース予測は精度が低く、全体精度を引き下げている
# - 結果として全体精度49.8%がベースライン55.1%を下回る（-5.3pt）
#
# 更新日: 2025-12-16
# 目的: 非1コース予測の抑制による全体精度向上

meta:
  version: "1.0"
  updated_at: "2025-12-16"
  description: "予測コース制御戦略の設定"

# ============================================================
# 予測コース強制化設定
# ============================================================
# 2025-12-16 バックテスト結果: コース強制化はROIを悪化させる
# - 1着予測精度: +5.6pt改善
# - しかし3連単ROI: -51pt悪化（167% → 116%）
# - 収支: -128,010円悪化
# 詳細: docs/COURSE_ENFORCEMENT_BACKTEST_RESULTS_20251216.md
course_enforcement:
  # 1コース強制化を有効にするか
  # バックテスト結果に基づき無効化（ROI悪化防止）
  enabled: false

  # 強制化モード
  # - 'all': 全ての予測を1コースに強制（ベースライン化）
  # - 'confidence_threshold': 指定信頼度以下のみ強制
  # - 'score_threshold': スコア差が閾値以下のとき強制
  # - 'combined': confidence_threshold + score_threshold の組み合わせ
  mode: 'score_threshold'

  # 信頼度閾値モード ('confidence_threshold', 'combined' 時に使用)
  # これ以下の信頼度では非1コース予測を1コースに強制
  confidence_threshold_settings:
    min_confidence: 'C'  # C以下（D, E）の信頼度で強制

  # スコア差閾値モード ('score_threshold', 'combined' 時に使用)
  # 1コースとのスコア差がこの値以下のとき、1コースに強制
  score_threshold_settings:
    min_score_difference: 15.0  # 1コースとのスコア差が15点以下なら1コースに強制
    # 2025年分析結果:
    # - 閾値15pt: 精度55.4%、ベースライン55.1%を+0.2pt上回る
    # - 閾値12pt: 精度54.8%、ベースライン比-0.3pt
    # - 閾値8pt: 精度53.2%、ベースライン比-1.9pt
    # 最適値として15ptを採用

# ============================================================
# 予測除外設定
# ============================================================
prediction_exclusion:
  # 信頼度D・Eを予測対象から除外するか
  exclude_low_confidence: false

  # 除外する信頼度リスト
  excluded_confidences:
    - 'E'  # 信頼度E（精度35.9%）は除外推奨

